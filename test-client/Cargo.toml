[package]
name = "test-client"
version = "0.1.0"
edition = "2021"
description = "Test client for the Arrow Flight shuffle service"

[dependencies]
arrow = { version = "54", features = ["ipc"] }
arrow-flight = "54"
arrow-schema = "54"
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
bytes = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
shuffle-server = { path = "../shuffle-server" }
